{% extends "base.html" %}
{% block content %}
<div class="panel" style="margin: 20px;">
    <h2>Схема маршрутов</h2>
    <p style="color: #666;">Визуализация последних рассчитанных маршрутов на основе координат.</p>
    
    <div style="display: flex; gap: 20px; margin-top: 20px;">
        <!-- Контейнер для карты (SVG) -->
        <div style="flex: 2; background: white; border: 2px solid #ccc; border-radius: 5px; overflow: hidden; position: relative;">
            <svg id="map-svg" width="100%" height="500" viewBox="0 0 500 500" style="background: #f9f9f9;">
                <!-- Здесь будут рисоваться линии и точки -->
            </svg>
        </div>
        
        <!-- Легенда (какие цвета что значат) -->
        <div style="flex: 1; background: #e0e0e0; padding: 20px; border-radius: 5px;">
            <h3>Легенда</h3>
            <ul style="list-style: none; padding: 0; line-height: 2;">
                <li><span style="display:inline-block; width:15px; height:15px; background:red; border-radius:50%; margin-right:10px;"></span> Склад</li>
                <li><span style="display:inline-block; width:15px; height:15px; background:green; border-radius:50%; margin-right:10px;"></span> Точки доставки</li>
                <li><span style="display:inline-block; width:30px; height:2px; background:blue; margin-right:10px; vertical-align: middle;"></span> Маршрут машины</li>
            </ul>
            <div id="route-legend" style="margin-top: 20px;">
                <!-- Сюда JS добавит названия машин и их цвета -->
            </div>
            <button class="btn" style="margin-top: 20px; width: 100%;" onclick="loadMap()">Обновить схему</button>
        </div>
    </div>
</div>
{% endblock %}
