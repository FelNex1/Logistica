{% extends "base.html" %}
{% block content %}
<div class="panel" style="margin: 20px;">
    <h2>Редактор ограничений и исходных координат</h2>
    
    <div style="display: flex; gap: 20px; margin-top: 20px;">
        <!-- Левая колонка: Общие ограничения -->
        <div style="flex: 1; background: #e0e0e0; padding: 20px; border-radius: 5px;">
            <h3 style="text-align: center;">Общие ограничения</h3>
            
            <div style="margin-bottom: 15px; text-align: center;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Максимальное время в пути на машину, мин</label>
                <input type="number" id="max-time" style="width: 80%; padding: 10px; border: none; background: #2ecc71; color: white; font-weight: bold; text-align: center;">
            </div>
            
            <div style="margin-bottom: 15px; text-align: center;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Смена начинается</label>
                <input type="time" id="shift-start" style="width: 80%; padding: 10px; border: none; background: #2ecc71; color: white; font-weight: bold; text-align: center;">
            </div>
            
            <div style="text-align: center;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Смена заканчивается</label>
                <input type="time" id="shift-end" style="width: 80%; padding: 10px; border: none; background: #2ecc71; color: white; font-weight: bold; text-align: center;">
            </div>
        </div>

        <!-- Правая колонка: Координаты -->
        <div style="flex: 1; background: #e0e0e0; padding: 20px; border-radius: 5px;">
            <h3 style="text-align: center;">Точки координат</h3>
            <table id="points-table" style="width: 100%; background: transparent; margin-bottom: 15px;">
                <tr><th>Точка</th><th>X</th><th>Y</th></tr>
                <!-- Строки будут добавлены через JS -->
            </table>
            
            <div style="text-align: center;">
                <button class="btn" style="background-color: #fbc531; color: black; border-radius: 20px; padding: 10px 30px;" onclick="addPointRow()">+ Точка</button>
            </div>
        </div>
    </div>

    <!-- Кнопка сохранения -->
    <div style="text-align: center; margin-top: 30px;">
        <button class="btn" style="width: auto; padding: 10px 40px; background: #f39c12;" onclick="saveAllData()">Сохранить изменения</button>
        <div id="save-result" style="margin-top: 15px; font-weight: bold;"></div>
    </div>
</div>
{% endblock %}
